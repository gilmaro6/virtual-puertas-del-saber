<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor Seguro | Danzara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <style>
    .protected-reader {
      position: relative;
      max-width: 860px;
      margin: 1.5rem auto;
      background: #ffffff;
      border: 1px solid var(--pds-border);
      border-radius: 0.75rem;
      padding: 2.5rem;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    .reader-content {
      font-family: 'Merriweather', Georgia, serif;
      font-size: 1.05rem;
      line-height: 1.85;
      white-space: pre-line;
      position: relative;
      z-index: 1;
      transition: filter 0.15s ease;
    }
    .reader-blurred .reader-content {
      filter: blur(18px);
    }
    .watermark-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3rem;
      padding: 2rem;
      opacity: 0.12;
      overflow: hidden;
    }
    .watermark-item {
      transform: rotate(-28deg);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--pds-primary);
      text-align: center;
      white-space: nowrap;
    }
    .focus-shield {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: rgba(20, 45, 78, 0.88);
      color: #ffffff;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .reader-blurred .focus-shield {
      display: flex;
    }
    @media print {
      body {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark navbar-pds shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
        <img src="assets/images/logo-danzara.jpg" alt="Logo Danzara" class="brand-logo">
        <span><i class="bi bi-arrow-left"></i> Volver a Danzara</span>
      </a>
      <span class="badge bg-warning text-dark">
        <i class="bi bi-shield-lock"></i> Lectura Protegida
      </span>
    </div>
  </nav>

  <main class="container my-3">
    <div id="readerAlert"></div>
    <div class="protected-reader shadow-sm" id="readerWrapper">
      <div class="focus-shield" id="focusShield">
        <i class="bi bi-shield-exclamation display-4 text-warning mb-2"></i>
        <h4 class="fw-bold">Contenido Protegido</h4>
        <p class="mb-0">La lectura se oculto al cambiar de ventana o perder el foco. Haz clic aqui para continuar leyendo.</p>
      </div>
      <div class="watermark-layer" id="watermarkLayer"></div>
      <div id="readerBody">
        <p class="text-center text-muted my-5">Verificando autorizacion de lectura...</p>
      </div>
    </div>
  </main>

  <script src="js/api.js?v=6"></script>
  <script src="js/visor.js?v=6"></script>
</body>
</html>
