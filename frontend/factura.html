<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factura de Venta | Danzara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <style>
    .invoice-paper {
      max-width: 860px;
      margin: 1.5rem auto;
      background: #ffffff;
      border: 1px solid var(--pds-border);
      border-radius: 0.5rem;
      padding: 2rem;
    }
    .invoice-header {
      border-bottom: 3px solid var(--pds-primary);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    .invoice-number-box {
      border: 2px solid var(--pds-primary);
      border-radius: 0.4rem;
      padding: 0.75rem 1rem;
      background-color: #f4f7fb;
    }
    @media print {
      body {
        background: #ffffff !important;
      }
      .no-print {
        display: none !important;
      }
      .invoice-paper {
        border: none !important;
        box-shadow: none !important;
        margin: 0 !important;
        padding: 0 !important;
        max-width: 100% !important;
      }
    }
  </style>
</head>
<body>
  <div class="container no-print pt-3">
    <div class="d-flex justify-content-between align-items-center" style="max-width: 860px; margin: 0 auto;">
      <button class="btn btn-outline-secondary btn-sm" onclick="window.history.back(); window.close();">
        <i class="bi bi-arrow-left"></i> Volver
      </button>
      <button class="btn btn-pds btn-sm" onclick="window.print()">
        <i class="bi bi-printer"></i> Imprimir / Guardar PDF
      </button>
    </div>
  </div>

  <div class="invoice-paper shadow-sm" id="invoiceContainer">
    <p class="text-center text-muted my-5">Cargando factura de venta...</p>
  </div>

  <script src="js/api.js?v=2"></script>
  <script src="js/factura.js?v=2"></script>
</body>
</html>
